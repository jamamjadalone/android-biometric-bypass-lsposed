name: Build & Release Universal Biometric Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare Artifact
        id: prepare_artifact
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          APK_NAME="UniversalBiometricBypass-${VERSION}.apk"
          mkdir -p release_artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "release_artifacts/${APK_NAME}"
          echo "apk_path=release_artifacts/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifact.outputs.version }}
          path: ${{ steps.prepare_artifact.outputs.apk_path }}

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_artifact.outputs.apk_path }}
          tag_name: ${{ github.ref_name }}
          name: Universal Biometric Bypass ${{ steps.prepare_artifact.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
